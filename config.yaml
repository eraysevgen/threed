#
# Configuration file
#

files:
  # the base file for kdtree or octree
  host_file   : "F:/git_repos/threed/.data/host_data.las"
  # the query file that each point queries against host, generally host=query
  query_file  : "F:/git_repos/threed/.data/host_data.las"
  # output npy file - same size as query points
  out_file    : "F:/git_repos/threed/.data/output.npy" 

neighborhood:
  # search method [knn,radius] 
  name      : "radius"
  # search engine [gpu, cpu], gpu is pcl/gpu/octree, cpu is nanoflann
  engine    : "cpu" 

  # radius search parameters
  radius    : 0.25        # radius distance if name is radius
  max_k     : 512         # maximum number of returns in range search, valid in radius search
  
  # knn parameters
  k         : 8           # number of points in knn search if name is knn

  # gpu batch size
  batch_size: 65536       # valid in pcl gpu range search if engine is gpu; pick a proper number with max_k or k considering your gpu memory
  

features:            
  # geometry is the default (9) features
  add_height  : false     # add 5 height features, default false
  add_density : true      # add 1 density features, in radius it is number of points, in knn it is radius , default false
  add_xyz     : false     # add xyz to at the end of the feature file, default false, better to have true for visualization

params:
  # number of cpu threads
  num_threads: 1
